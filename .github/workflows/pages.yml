name: Build and Deploy Playtest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache GBDK-2020 4.5.0
        id: cache-gbdk
        uses: actions/cache@v4
        with:
          path: tools/.gbdk-linux64
          key: gbdk-2020-4.5.0-linux64

      - name: Download GBDK-2020 4.5.0
        if: steps.cache-gbdk.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o tools/gbdk-linux64.tar.gz https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz

      - name: Build ROM and run headless tests
        run: node tools/test.mjs

      - name: Bundle standalone playtest page
        run: |
          node tools/bundle.mjs --standalone
          mkdir -p build/pages
          cp build/playtest-standalone.html build/pages/index.html
          cp build/roguegb.gb build/pages/roguegb.gb
          cp build/icon-192.png build/pages/icon-192.png
          cp build/icon-512.png build/pages/icon-512.png
          cp web/manifest.webmanifest build/pages/manifest.webmanifest
          cp web/sw.js build/pages/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
